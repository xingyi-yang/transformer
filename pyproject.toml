[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "send-bw"
version = "0.1.0"
description = "Longitudinal body-weight modeling and simulation-informed preclinical design from SEND-organized data (research software, not regulatory-grade)."
readme = "README.md"
requires-python = ">=3.11"
# Versions below are the ones actually installed and tested in this repository (see README).
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "torch>=2.4",
]

[project.optional-dependencies]
bayesian = ["pymc>=5.16", "arviz>=0.19", "nutpie>=0.13", "numba>=0.60"]
snowflake = ["snowflake-connector-python>=3.10"]
xpt = ["pyreadstat>=1.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
send-bw = "send_bw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: expensive statistical calibration or Bayesian runs (deselect with -m 'not slow')",
    "bayesian: requires the bayesian extra",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
