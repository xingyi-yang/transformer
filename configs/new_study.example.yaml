# Example future-study design request (synthetic proof of concept).
request_id: NEW-RAT-28D-001
species: RAT
strain: SPRAGUE-DAWLEY
study_class: REPEAT_DOSE_TOX
sexes: [M, F]
sex_strategy: pooled_with_sex_covariate   # common treatment effect across sexes; equal allocation per sex
baseline_distribution:                    # observed baseline weight at day 1 (predose), grams
  M: {mean_g: 260.0, sd_g: 18.0}
  F: {mean_g: 195.0, sd_g: 13.0}
groups:                                    # planned regimens (SEND study days, no day 0)
  - {name: control, is_control: true, route: ORAL GAVAGE, interval_days: 1, start_dy: 1, end_dy: 28}
  - {name: low, compound_id: CMP03, dose: 30, route: ORAL GAVAGE, interval_days: 1, start_dy: 1, end_dy: 28}
  - {name: high, compound_id: CMP03, dose: 300, route: ORAL GAVAGE, interval_days: 1, start_dy: 1, end_dy: 28}
compound_descriptors: {}                   # curated descriptors for compounds absent from the reference
horizon_day: 28                            # elapsed day T (= SEND day 29), fixed estimand time
estimand: fixed_time_log_weight_difference
meaningful_effects_pct: {low: -5.0, high: -5.0}   # geometric-mean ratio difference at T, percent
alpha: 0.05
multiplicity: holm
power_target: 0.80
power_requirement: all_required
required_comparisons: [low, high]
fwer_max: 0.05
fwer_tolerance: 0.015
fwer_upper_tolerance: 0.045
power_lower_tolerance: 0.06
coverage_min: 0.92
max_abs_bias_fraction: 0.15
max_failure_rate: 0.02
precision_max_halfwidth: null
ci_level: 0.95
constraints: {min_per_sex_per_group: 4, max_total_animals: 120}
candidate_n_per_sex: [6, 8, 10, 12, 15]
candidate_allocations:
  equal: {}
  control_heavy: {control: 1.34}
candidate_schedules:
  endpoint_only: [28]
  biweekly: [14, 28]
  weekly: [7, 14, 21, 28]
  twice_weekly: [3, 7, 10, 14, 17, 21, 24, 28]
analyses: [ancova, gls]
gls_variance: model
missing_data: {p_missed_visit: 0.02, p_dropout: 0.02}
costs: {per_animal: 1.0, per_measurement: 0.02, per_day: 0.0}
missing_feature_declarations: []
secondary_contrast: {times: [7, 14, 21, 28], weights: [0.25, 0.25, 0.25, 0.25]}   # GLS only; reported, not optimized
