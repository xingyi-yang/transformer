# Longer TFT encoder: attach observed pretreatment visits (synthetic diagnostic).
# Same larger-bank splits and DAY<=14 cutoff. Same locked knobs. No search.
# Official and new test errors are not used to retune.
# Synthetic diagnostic. Not design qualification. No real-data validation.
# No operational recommendation.
run_name: tft_longer_ctx
output_dir: runs/tft_longer_ctx
larger_bank_dir: runs/tft_larger_bank
generate_seed: 81011
train_seed: 83011
seed: 83011
longer_ctx:
  include_pretreatment_encoder: true
  encoder_window_day: 14
  development_reference: tft_target_only
  search: false
  source_cells:
    target_only: runs/tft_larger_bank/datasets/d0/trains/t0/cells/d0_t0_matched_target_only
    pooled: runs/tft_larger_bank/datasets/d0/trains/t0/cells/d0_t0_matched_pooled
  short_context_dir: runs/tft_larger_bank
  short_context_examples: runs/tft_larger_bank/holdout/examples.csv
models:
  optional:
    tft:
      enabled: true
      hidden_size: 16
      lstm_layers: 1
      attention_head_size: 2
      hidden_continuous_size: 8
      batch_size: 32
      lr: 0.01
      dropout: 0.1
      max_epochs: 16
      patience: 6
      encoder_window_day: 14
      max_encoder_length: 8
      max_prediction_length: 6
      min_encoder_length: 1
      torch_threads: 2
      window_balance: study
      target_normalizer: species_or_global
      quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
      optimizer: adamw
      seed: 83011
finetune:
  lr: 0.001
  max_epochs: 8
  patience: 4
evaluation:
  tasks: [early_history]
  early_history_window_day: 14
design: {}
labels:
  - Synthetic diagnostic.
  - Not design qualification.
  - No real-data validation.
  - No operational recommendation.
