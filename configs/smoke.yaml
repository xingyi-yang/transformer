# Smoke run: small synthetic data and LOW Monte Carlo replication.
# Outputs are a NONCONCLUSIVE SOFTWARE CHECK and a SYNTHETIC PROOF OF CONCEPT only.
run_name: smoke
output_dir: runs/smoke
seed: 20261017
synthetic:
  enabled: true
  out_dir: runs/smoke/synthetic
  generator: A
  n_studies: 16
  n_compounds: 7
  n_per_sex: [4, 6]
mapping: configs/mappings/example_send.yaml
source:
  type: local
  root: runs/smoke/synthetic/send
  layout: per_study
  metadata_dir: runs/smoke/synthetic/metadata
cohort:
  species: RAT
  study_classes: [REPEAT_DOSE_TOX]
  max_day: 28
splits:
  method: random
  validation: 0.2
  test: 0.2
  compound_holdout_auto: 1
models:
  spline: {enabled: true, n_bootstrap: 6}
  transformer: {enabled: true, n_members: 2, max_epochs: 40, patience: 8, d_model: 32, n_heads: 2}
  bayesian: {enabled: false}          # see bayesian_smoke.yaml
  optional:                           # never required, never substituted for a required benchmark
    # TFT extra is not installed in the default env; status stays not_run (early-history only).
    tft: {enabled: true, max_epochs: 8, hidden_size: 16, attention_head_size: 2, dropout: 0.1}
    chronos2: {enabled: true, download_permission: false}
    deepar: {enabled: true}
evaluation:
  n_draws: 150
  contrast_day: 28
  early_history_window_day: 14
design:
  request: configs/new_study.smoke.yaml
  proposal_models: [spline, transformer]
  replicates_proposal: 400
  replicates_final: 600
  n_finalists: 2
  stress: true
  oracle: true
