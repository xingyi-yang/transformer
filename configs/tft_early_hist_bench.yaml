# Unlocked synthetic TFT early-history benchmark.
# Reads official_seq prepared cells; does not write runs/v3_*.
# Windows are observed DAY values only. No illustrative calendars.
# Synthetic diagnostic. Not design qualification. No real-data validation.
# No operational recommendation.
run_name: tft_early_hist_bench
output_dir: runs/tft_early_hist_bench
generate_seed: 71001
train_seed: 82001
seed: 82001
benchmark:
  source_cells:
    target_only: runs/v3_official_seq/datasets/d0/trains/t0/cells/d0_t0_matched_target_only
    pooled: runs/v3_official_seq/datasets/d0/trains/t0/cells/d0_t0_matched_pooled
  encoder_window_day: 14
  target_species: RAT
models:
  optional:
    tft:
      enabled: true
      max_epochs: 8
      patience: 4
      hidden_size: 16
      lstm_layers: 1
      attention_head_size: 2
      hidden_continuous_size: 8
      batch_size: 32
      lr: 0.003
      encoder_window_day: 14
      max_encoder_length: 8
      max_prediction_length: 6
      min_encoder_length: 1
      torch_threads: 2
evaluation:
  tasks: [early_history]
  early_history_window_day: 14
design: {}
labels:
  - Synthetic diagnostic.
  - Not design qualification.
  - No real-data validation.
  - No operational recommendation.
