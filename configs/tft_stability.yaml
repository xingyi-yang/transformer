# TFT training stability and 80% prediction intervals (synthetic diagnostic).
# Seeds, splits, selection rule, and the confirm holdout are predeclared
# before any new scores are examined. Official holdout test errors are not
# used to choose the training strategy or the interval remedy.
# Windows are observed DAY values only. No illustrative calendars.
# Synthetic diagnostic. Not design qualification. No real-data validation.
# No operational recommendation.
run_name: tft_stability
output_dir: runs/tft_stability
primary_dir: runs/tft_primary
pilot_dir: runs/tft_early_hist_bench
extend_dir: runs/tft_early_hist_extend
generate_seed: 71001
train_seed: 82001
seed: 82001
benchmark:
  source_cells:
    target_only: runs/v3_official_seq/datasets/d0/trains/t0/cells/d0_t0_matched_target_only
    pooled: runs/v3_official_seq/datasets/d0/trains/t0/cells/d0_t0_matched_pooled
  encoder_window_day: 14
  target_species: RAT
  extra_split_seed: 33001
  extra_split_dir: runs/tft_early_hist_extend/banks/split_33001
  stability_seeds: [82001, 82021, 82031]
  # New confirmation holdout. Previously reported test studies cannot be test.
  confirm_split_seed: 34011
  confirm_forbidden_test_studies: [SYNA-007, SYNA-010, SYNA-011]
# Locked architecture from the validation-led search in runs/tft_primary.
models:
  optional:
    tft:
      enabled: true
      hidden_size: 16
      lstm_layers: 1
      attention_head_size: 2
      hidden_continuous_size: 8
      batch_size: 32
      lr: 0.01
      dropout: 0.1
      max_epochs: 16
      patience: 6
      encoder_window_day: 14
      max_encoder_length: 8
      max_prediction_length: 6
      min_encoder_length: 1
      torch_threads: 2
      window_balance: study
      target_normalizer: species_or_global
      quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
      optimizer: adamw
finetune:
  lr: 0.001
  max_epochs: 8
  patience: 4
# One interval remedy. Margin is fit on validation pairs of that run.
calibration:
  method: cqr_additive
  alpha: 0.2
  apply_to: target_only
  selection_metric: interval_score80
  note: Adopt CQR for target-only if it lowers validation interval score.
# Default training strategy is chosen on official validation only.
selection:
  bank: official_validation
  metric: interval_score80
  aggregate: mean_across_seeds
  candidates: [tft_target_only, tft_target_only_cqr, tft_pooled, tft_finetune]
  confirm_bank: confirm_34011
evaluation:
  tasks: [early_history]
  early_history_window_day: 14
  common_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
design: {}
labels:
  - Synthetic diagnostic.
  - Not design qualification.
  - No real-data validation.
  - No operational recommendation.
